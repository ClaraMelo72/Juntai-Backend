services:
  postgres:
    image: postgres:16
    container_name: postgres_juntai
    restart: always
    ports:
      - '5433:5432'
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: juntai_db
      TZ: America/Recife
      PGTZ: America/Recife
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U admin -d juntai_db']
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: builder          # usa o estágio de build, que já tem tudo p/ dev
    container_name: juntai_api
    restart: always
    command: npm run dev        # hot-reload com ts-node-dev, bom pro dia a dia do grupo
    ports:
      - '3333:3333'
    env_file:
      - .env
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: admin
      DB_PASSWORD: admin
      DB_NAME: juntai_db
    volumes:
      - .:/app
      - /app/node_modules
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
